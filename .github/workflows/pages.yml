name: pages

# Runs only when started by hand, so a branch-based Pages setup
# (main / root) does not fail a check on every push.
# Settings → Pages → Source: GitHub Actions, then run this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir -p _site/css _site/js
          cp index.html upload.html paywall.html success.html report.html robots.txt sitemap.xml favicon.svg .nojekyll _site/
          cp css/styles.css _site/css/
          cp js/*.js _site/js/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
